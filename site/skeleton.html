<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵魂鉴定所 · 动漫人格匹配</title>
<meta name="description" content="回答 18 道关于爱情、友情、困难、热爱、美好与生死的人生命题，在 200 位知名日漫角色中找到与你灵魂最接近的那一个。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23F6E7EC'/%3E%3Cpath d='M32 14c-4.5 3.2-7.5 7.4-7.5 11.9 0 2.9 1.9 4.8 4.2 4.8 1.8 0 3.3-1.2 3.3-3 0 3.4 2.5 5.5 5.3 5.5 2.6 0 4.4-2 4.4-4.9 0-4.3-4-9.6-9.7-12.3z' fill='%23E8A0B4'/%3E%3Cpath d='M46 30c-2.4 1.7-4 4-4 6.4 0 1.6 1 2.6 2.3 2.6 1 0 1.8-.6 1.8-1.6 0 1.8 1.3 3 2.8 3 1.4 0 2.4-1.1 2.4-2.6 0-2.3-2.1-5.1-5.3-6.6z' fill='%23C97A90'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ===== 基础与色板 ===== */
:root{
  --paper:#FAF7F2; --paper2:#F3EDE4;
  --sakura:#E8A0B4; --sakura-deep:#C97A90; --sakura-pale:#F6E7EC; --sakura-faint:#FBF0F3;
  --indigo:#5B7FA6; --sky:#A9C7E0; --sky-pale:#EAF2F9;
  --grass:#9DBE8E; --gold:#E4C990;
  --ink:#3A3440; --ink-soft:#6E6472; --line:#E5DBD2;
  --serif:"Noto Serif SC",Georgia,"Songti SC","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans); color:var(--ink); background:var(--paper);
  background-image:radial-gradient(circle at 15% 8%, rgba(232,160,180,.10), transparent 42%), radial-gradient(circle at 85% 20%, rgba(91,127,166,.08), transparent 46%), radial-gradient(circle at 60% 95%, rgba(157,190,142,.07), transparent 40%);
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
::selection{background:var(--sakura);color:#fff}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
.view{display:none}
.view.active{display:block;animation:fadeIn .45s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== 图标（内联 SVG 通用）===== */
.ic{width:1.1em;height:1.1em;vertical-align:-.15em;fill:currentColor}

/* ===== 首页 hero ===== */
.hero{
  position:relative; min-height:100vh; display:flex; align-items:center; justify-content:center;
  text-align:center; overflow:hidden;
}
.hero-bg{
  position:absolute; inset:0; background:url(assets/hero.png) center/cover no-repeat;
  transform:scale(1.02);
}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(250,247,242,.18) 0%, rgba(250,247,242,.55) 58%, var(--paper) 100%)}
.hero-inner{position:relative;z-index:2;padding:30px 22px 60px;max-width:640px}
.hero-kicker{
  display:inline-flex; align-items:center; gap:8px; font-size:14px; letter-spacing:.35em;
  color:var(--sakura-deep); background:rgba(250,247,242,.72); border:1px solid rgba(201,122,144,.28);
  padding:7px 16px 7px 18px; border-radius:999px; backdrop-filter:blur(4px);
}
.hero-kicker svg{width:15px;height:15px}
.hero h1{
  font-family:var(--serif); font-weight:900; font-size:clamp(40px,7.4vw,62px); line-height:1.18;
  margin:26px auto 14px; letter-spacing:.02em; color:#3A3440;
  text-shadow:0 1px 0 rgba(255,255,255,.6);
}
.hero h1 .sub{display:block;font-size:clamp(15px,2.2vw,19px);font-weight:500;letter-spacing:.5em;color:var(--sakura-deep);margin-top:10px}
.hero p.lead{font-size:15.5px;line-height:2;color:var(--ink-soft);max-width:520px;margin:0 auto 34px;letter-spacing:.02em}
.btn{
  display:inline-flex; align-items:center; gap:10px; font-size:17px; font-weight:700;
  color:#fff; background:linear-gradient(135deg,var(--sakura) 0%,var(--sakura-deep) 100%);
  padding:16px 42px; border-radius:999px; box-shadow:0 10px 26px rgba(201,122,144,.32);
  transition:transform .22s ease, box-shadow .22s ease;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(201,122,144,.4)}
.btn.ghost{background:transparent;color:var(--sakura-deep);border:1.5px solid var(--sakura);box-shadow:none}
.btn.ghost:hover{background:var(--sakura-faint)}
.btn.small{padding:11px 26px;font-size:14.5px}
.hero-note{margin-top:20px;font-size:13.5px;color:var(--ink-soft);letter-spacing:.06em}
.hero-flow{
  margin-top:44px; display:flex; justify-content:center; gap:26px; flex-wrap:wrap;
  font-size:13px; color:var(--ink-soft);
}
.hero-flow span{display:inline-flex;align-items:center;gap:7px}
.hero-flow i{font-style:normal;width:24px;height:24px;border-radius:50%;background:rgba(250,247,242,.75);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--sakura-deep);font-size:12px}

/* ===== 性别选择 ===== */
.page{padding:64px 0 80px}
.page-title{text-align:center;margin-bottom:34px}
.page-title h2{font-family:var(--serif);font-weight:900;font-size:clamp(26px,4.5vw,34px);letter-spacing:.04em}
.page-title p{color:var(--ink-soft);font-size:14px;margin-top:10px;letter-spacing:.04em}
.gender-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.gender-card{
  position:relative; border:1.5px solid var(--line); border-radius:18px; padding:36px 20px 30px;
  text-align:center; background:#fff; transition:all .24s ease; overflow:hidden;
}
.gender-card::before{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:var(--sakura);opacity:0;transition:opacity .24s}
.gender-card:hover{border-color:var(--sakura);transform:translateY(-3px);box-shadow:0 12px 28px rgba(201,122,144,.14)}
.gender-card:hover::before{opacity:1}
.gender-card .glyph{width:84px;height:84px;margin:0 auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--sakura-faint);border:1px solid var(--sakura-pale)}
.gender-card .glyph.female{background:var(--sky-pale);border-color:#D6E4F2}
.gender-card h3{font-family:var(--serif);font-size:24px;font-weight:900;letter-spacing:.1em}
.gender-card p{font-size:13px;color:var(--ink-soft);margin-top:8px;line-height:1.8}
.gender-card .tag{display:inline-block;margin-top:14px;font-size:12px;color:var(--sakura-deep);border:1px solid rgba(201,122,144,.3);border-radius:999px;padding:4px 14px;background:#fff}
.gender-card.female .tag{color:var(--indigo);border-color:rgba(91,127,166,.32)}

/* ===== 答题页 ===== */
.quiz-head{display:flex;align-items:center;gap:14px;padding:22px 0 6px}
.quiz-head .qno{font-family:var(--serif);font-weight:900;color:var(--sakura-deep);font-size:15px;letter-spacing:.12em;white-space:nowrap}
.progress{flex:1;height:8px;border-radius:99px;background:var(--paper2);overflow:hidden}
.progress i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--sakura),var(--sakura-deep));transition:width .35s ease}
.quiz-meta{display:flex;align-items:center;gap:10px;margin:18px 0 6px}
.chip{font-size:12px;letter-spacing:.08em;border-radius:999px;padding:4px 12px;background:var(--sky-pale);color:var(--indigo);border:1px solid rgba(91,127,166,.18)}
.chip.situational{background:var(--sakura-faint);color:var(--sakura-deep);border-color:rgba(201,122,144,.2)}
.q-card{
  background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:34px 30px;
  box-shadow:0 16px 44px rgba(60,52,64,.06); margin-top:8px;
}
.q-card .qtext{font-family:var(--serif);font-weight:700;font-size:clamp(18px,3vw,22px);line-height:1.75;letter-spacing:.02em}
.options{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.opt{
  position:relative;display:flex;align-items:flex-start;gap:14px;text-align:left;
  border:1.5px solid var(--line);border-radius:14px;padding:15px 18px;background:#FEFCF9;
  transition:all .2s ease; font-size:15px; line-height:1.65;
}
.opt:hover{border-color:var(--sakura);background:var(--sakura-faint);transform:translateX(3px)}
.opt .k{
  flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;transition:all .2s;
}
.opt:hover .k{border-color:var(--sakura);color:var(--sakura-deep)}
.opt.sel{border-color:var(--sakura-deep);background:var(--sakura-faint)}
.opt.sel .k{background:var(--sakura-deep);border-color:var(--sakura-deep);color:#fff}
.quiz-nav{display:flex;justify-content:space-between;margin-top:24px;align-items:center}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-soft);padding:10px 6px}
.back-link:hover{color:var(--sakura-deep)}
.next-btn{padding:13px 34px;border-radius:999px;background:var(--sakura-deep);color:#fff;font-size:15px;font-weight:700;transition:all .2s}
.next-btn:hover{background:#b56a81}
.next-btn:disabled{opacity:.4;cursor:default}

/* ===== 结果页 ===== */
.result-top{text-align:center;padding:26px 0 10px}
.result-top .r-kicker{font-size:12.5px;letter-spacing:.4em;color:var(--sakura-deep)}
.result-top h2{font-family:var(--serif);font-weight:900;font-size:clamp(26px,4.6vw,36px);margin-top:10px;letter-spacing:.05em}
.result-top .r-sub{color:var(--ink-soft);font-size:14px;margin-top:8px}
.match-ring{
  --p:0; width:172px;height:172px;margin:22px auto 6px;border-radius:50%;position:relative;
  background:conic-gradient(var(--sakura) calc(var(--p)*1%), var(--paper2) 0);
  display:flex;align-items:center;justify-content:center;
}
.match-ring::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--paper)}
.match-ring .inner{position:relative;text-align:center}
.match-ring .inner b{font-family:var(--serif);font-size:40px;font-weight:900;color:var(--sakura-deep);display:block;line-height:1}
.match-ring .inner span{font-size:12px;color:var(--ink-soft);letter-spacing:.2em}
.hero-card{
  background:#fff;border:1.5px solid var(--line);border-radius:24px;padding:34px 30px 30px;margin-top:18px;
  box-shadow:0 18px 50px rgba(60,52,64,.07); text-align:center; position:relative; overflow:hidden;
}
.hero-card::before{content:"";position:absolute;inset:0 0 auto 0;height:110px;background:linear-gradient(180deg,var(--sakura-faint),transparent)}
.char-seal{
  width:104px;height:104px;margin:8px auto 16px;border-radius:50%;
  background:radial-gradient(circle at 32% 30%, #fff, var(--sakura-pale));
  border:2px solid var(--sakura); display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px rgba(201,122,144,.25); position:relative; z-index:1;
}
.char-seal svg{width:56px;height:56px}
.char-name{font-family:var(--serif);font-size:clamp(26px,4.6vw,34px);font-weight:900;letter-spacing:.05em}
.char-work{color:var(--indigo);font-size:14px;margin-top:4px;letter-spacing:.06em}
.char-quote{font-family:'Noto Serif SC',serif;color:var(--sakura-deep);font-size:17px;font-weight:600;line-height:1.8;margin-top:16px;padding:12px 22px;border-radius:14px;background:var(--sakura-faint);position:relative;max-width:480px;margin-left:auto;margin-right:auto}
.char-quote::before{content:'\201C';position:absolute;left:10px;top:2px;font-size:26px;color:rgba(201,122,144,.4);font-family:'Noto Serif SC',serif}
.char-quote::after{content:'\201D';position:absolute;right:10px;bottom:-4px;font-size:26px;color:rgba(201,122,144,.4);font-family:'Noto Serif SC',serif}
.char-desc{color:var(--ink-soft);font-size:14.5px;line-height:1.9;margin-top:14px;max-width:480px;margin-left:auto;margin-right:auto}
.char-tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.char-tags span{font-size:12.5px;border-radius:999px;padding:5px 14px;background:var(--sky-pale);color:var(--indigo);border:1px solid rgba(91,127,166,.16)}
.char-tags span.arche{background:var(--sakura-faint);color:var(--sakura-deep);border-color:rgba(201,122,144,.2)}
.block{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:26px 26px;margin-top:20px}
.block h3{font-family:var(--serif);font-size:17px;font-weight:900;letter-spacing:.06em;margin-bottom:16px;display:flex;align-items:center;gap:9px}
.block h3 .num{color:var(--sakura-deep);font-size:13px;letter-spacing:.2em}
.radar-wrap{width:100%;max-width:420px;margin:0 auto}
.resonance{display:flex;flex-direction:column;gap:10px}
.resonance .row{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.7}
.resonance .row .dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px}
.resonance .row.good .dot{background:var(--sakura)}
.resonance .row.diff .dot{background:var(--indigo)}
.resonance .row b{color:var(--ink)}
.resonance .row .dname{color:var(--sakura-deep);font-weight:700}
.top3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.top3-item{border:1.5px solid var(--line);border-radius:16px;padding:20px 12px;text-align:center;background:#FEFCF9;transition:all .2s}
.top3-item:hover{border-color:var(--sakura);transform:translateY(-2px)}
.top3-item .rank{font-family:var(--serif);font-size:13px;letter-spacing:.2em;color:var(--sakura-deep)}
.top3-item .nm{font-family:var(--serif);font-weight:700;font-size:15.5px;margin-top:8px}
.top3-item .wk{font-size:11.5px;color:var(--ink-soft);margin-top:4px}
.top3-item .mt{font-size:13px;color:var(--indigo);font-weight:700;margin-top:8px}
.share-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.restart{text-align:center;margin-top:26px}
.restart a{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-soft);border-bottom:1px dashed var(--line);padding-bottom:3px}
.restart a:hover{color:var(--sakura-deep)}

/* ===== 页脚 ===== */
.foot{text-align:center;padding:44px 0 36px;font-size:12px;color:var(--ink-soft);letter-spacing:.05em;line-height:2}
.foot .motto{font-family:var(--serif);font-size:13px;color:var(--sakura-deep);letter-spacing:.3em;margin-bottom:6px}

/* ===== toast ===== */
#toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);z-index:99;
  background:var(--ink);color:#fff;padding:12px 24px;border-radius:999px;font-size:14px;
  opacity:0;pointer-events:none;transition:all .3s ease; box-shadow:0 10px 30px rgba(0,0,0,.25);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== 响应式 ===== */
@media (max-width:640px){
  .gender-grid{grid-template-columns:1fr}
  .top3{grid-template-columns:1fr}
  .q-card{padding:26px 18px}
  .hero-flow{display:none}
  .wrap{padding:0 14px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;transition-duration:.001s!important}
}
</style>
</head>
<body>
<!-- ===== 视图容器 ===== -->
<main id="app"></main>
<div id="toast"></div>
<!-- ===== 数据（由构建脚本注入）===== -->
<script id="data">/*__DATA__*/</script>
<!-- ===== 应用逻辑 ===== -->
<script id="appjs">/*__APPJS__*/</script>
</body>
</html>
